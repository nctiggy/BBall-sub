# Default values for basketball-sub
replicaCount: 2

image:
  repository: basketball-sub
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Service configuration
service:
  # Options: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP
  port: 80
  targetPort: 80
  # NodePort (30000-32767) - only used if type is NodePort
  nodePort: 30080
  # LoadBalancer specific settings
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: basketball-sub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: basketball-sub-tls
  #    hosts:
  #      - basketball-sub.example.com

# Gateway API configuration (for service mesh/modern ingress)
gateway:
  enabled: false
  # The Gateway name to attach to (must exist)
  gatewayName: "default-gateway"
  gatewayNamespace: "gateway-system"
  # HTTPRoute configuration
  hostnames:
    - "basketball-sub.example.com"
  # Optional: TLS configuration
  tls:
    enabled: false
    certificateRef:
      name: basketball-sub-cert
      namespace: default

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - basketball-sub
          topologyKey: kubernetes.io/hostname

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
